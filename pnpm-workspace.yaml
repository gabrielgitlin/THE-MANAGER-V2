packages:
  - apps/*
  - packages/*

# Shared versions for the new backend packages. Keep on the latest stable release.
# TypeScript stays on 6.0.x until typescript-eslint supports TypeScript 7.
catalog:
  "@eslint/js": 10.0.1
  "@fastify/cors": 11.4.3
  "@fastify/helmet": 13.2.0
  "@fastify/sensible": 6.0.8
  "@fastify/swagger": 9.9.5
  "@types/node": 26.6.6
  dotenv: 18.0.10
  drizzle-kit: 0.31.11
  drizzle-orm: 0.45.4
  eslint: 10.15.0
  eslint-config-prettier: 10.1.8
  fastify: 5.12.8
  fastify-type-provider-zod: 7.0.0
  globals: 17.14.0
  pg-boss: 12.39.0
  pino: 10.4.0
  postgres: 4.1.1
  prettier: 3.10.1
  turbo: 2.11.13
  typescript: 6.0.3
  typescript-eslint: 8.73.0
  vitest: 5.1.1
  zod: 4.6.7

minimumReleaseAgeExclude:
  - pg-boss@12.39.0

allowBuilds:
  esbuild: true
  core-js: false
